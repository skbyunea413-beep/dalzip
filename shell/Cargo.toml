[package]
name = "dz_shell"
version = "0.1.0"
edition = "2021"
description = "Explorer context menu for dalzip (IExplorerCommand)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]
